# ============================================================
# Docker Compose 配置
# ============================================================
#
# 容器全栈启动（生产式镜像，app/socket 读取 .env.production）:
#   docker compose --env-file .env.production up -d
#
# 仅启动基础服务（宿主机本地开发用，Next/Socket 仍在宿主机运行）:
#   docker compose --env-file .env.development up -d postgres redis meilisearch
#
# 停止宿主机开发基础服务:
#   docker compose --env-file .env.development down
#
# 停止容器全栈:
#   docker compose --env-file .env.production down
#
# 查看容器全栈日志:
#   docker compose --env-file .env.production logs -f app socket
#
# 重新构建容器全栈:
#   docker compose --env-file .env.production up -d --build
#
# 容器内数据库迁移:
#   docker compose --env-file .env.production run --rm --build migrate pnpm exec prisma db push
#
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------- PostgreSQL ----------
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: ${APP_NAME:-acgn}-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-acgn}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Redis ----------
  redis:
    image: docker.io/library/redis:8-alpine
    container_name: ${APP_NAME:-acgn}-redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Meilisearch（全文搜索） ----------
  meilisearch:
    image: docker.io/getmeili/meilisearch:v1.12
    container_name: ${APP_NAME:-acgn}-meilisearch
    restart: unless-stopped
    logging: *default-logging
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in the compose env file}
      MEILI_NO_ANALYTICS: "true"
      MEILI_HTTP_ADDR: 0.0.0.0:7700
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------- Next.js 应用 ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: ${APP_NAME:-acgn}-app
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    ports:
      - "${APP_PORT:-80}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-acgn}?schema=public
      REDIS_URL: redis://redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILI_MASTER_KEY}
      NODE_ENV: production
    env_file:
      - .env.production
    volumes:
      - uploads_data:/app/uploads
      - data_dir:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:3000/robots.txt || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------- Socket.io 实时通信 ----------
  socket:
    build:
      context: .
      dockerfile: Dockerfile
      target: socket-runner
    container_name: ${APP_NAME:-acgn}-socket
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 15s
    ports:
      - "${SOCKET_PORT:-3001}:3001"
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-acgn}?schema=public
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILI_MASTER_KEY}
      SOCKET_PORT: "3001"
      NODE_ENV: production
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  # ---------- Prisma 数据库迁移 ----------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-acgn}?schema=public
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  uploads_data:
  data_dir:
